# =============================================================================
# reporting (C# / .NET 8) - Deployment + Service.
# NOTE: the /healthz probe assumes the reporting service agent maps a health
# endpoint at that path; adjust if a different route is exposed.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: lodestar
  labels:
    app.kubernetes.io/name: reporting
    app.kubernetes.io/instance: lodestar
    app.kubernetes.io/component: reporting
    app.kubernetes.io/part-of: lodestar
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting
      app.kubernetes.io/instance: lodestar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reporting
        app.kubernetes.io/instance: lodestar
        app.kubernetes.io/component: reporting
        app.kubernetes.io/part-of: lodestar
        app.kubernetes.io/version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        runAsGroup: 10004
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reporting
          image: ghcr.io/lodestar-oss/lodestar-reporting:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4200
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: REPORTING_PORT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: ASPNETCORE_URLS
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reporting
  namespace: lodestar
  labels:
    app.kubernetes.io/name: reporting
    app.kubernetes.io/instance: lodestar
    app.kubernetes.io/component: reporting
    app.kubernetes.io/part-of: lodestar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reporting
    app.kubernetes.io/instance: lodestar
  ports:
    - name: http
      port: 4200
      targetPort: http
      protocol: TCP
