# =============================================================================
# web (Next.js 16 dashboard) - Deployment + Service.
# 2 replicas behind the ingress. SQLite lives on an emptyDir mounted at /data:
# acceptable for the sandbox (data is re-seeded on pod restart); production
# should point DATABASE_URL at managed Postgres (see ARCHITECTURE.md ADR-004).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lodestar
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: lodestar
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lodestar
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: lodestar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: lodestar
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: lodestar
        app.kubernetes.io/version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/lodestar-oss/lodestar-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: WEB_PORT
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              value: file:/data/custom.db
            - name: GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: GATEWAY_URL
            - name: AIOPS_URL
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: AIOPS_URL
            - name: NEXT_PUBLIC_APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: NEXT_PUBLIC_APP_VERSION
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lodestar
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: lodestar
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lodestar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: lodestar
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
