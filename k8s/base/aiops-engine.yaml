# =============================================================================
# aiops-engine (Python 3.12 / FastAPI) - Deployment + Service.
# Pull-based anomaly/forecast engine; polls the gateway every 5s, so a single
# replica is sufficient (scale out behind the gateway proxy if ever needed).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-engine
  namespace: lodestar
  labels:
    app.kubernetes.io/name: aiops-engine
    app.kubernetes.io/instance: lodestar
    app.kubernetes.io/component: aiops
    app.kubernetes.io/part-of: lodestar
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-engine
      app.kubernetes.io/instance: lodestar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-engine
        app.kubernetes.io/instance: lodestar
        app.kubernetes.io/component: aiops
        app.kubernetes.io/part-of: lodestar
        app.kubernetes.io/version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiops-engine
          image: ghcr.io/lodestar-oss/lodestar-aiops:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3200
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: AIOPS_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: LOG_LEVEL
            - name: GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: lodestar-config
                  key: GATEWAY_URL
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-engine
  namespace: lodestar
  labels:
    app.kubernetes.io/name: aiops-engine
    app.kubernetes.io/instance: lodestar
    app.kubernetes.io/component: aiops
    app.kubernetes.io/part-of: lodestar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aiops-engine
    app.kubernetes.io/instance: lodestar
  ports:
    - name: http
      port: 3200
      targetPort: http
      protocol: TCP
