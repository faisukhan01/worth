# =============================================================================
# EXAMPLE ONLY - do not apply this file to a real cluster as-is.
#
# Real secrets must never be committed. Provision them out-of-band instead:
#   kubectl -n lodestar create secret generic lodestar-secrets \
#     --from-literal=API_KEYS='<your-production-key>'
# or use a secret manager (sealed-secrets, external-secrets, SOPS).
#
# NOTE: this file is intentionally NOT listed in kustomization.yaml, but the
# Deployments reference the `lodestar-secrets` Secret - create it before
# applying the kustomize overlay or pods will fail to start.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lodestar-secrets
  namespace: lodestar
  labels:
    app.kubernetes.io/part-of: lodestar
type: Opaque
stringData:
  # Comma-separated list of accepted ingest API keys (any `pg_live_*` in dev).
  API_KEYS: "pg_live_demo_key"
