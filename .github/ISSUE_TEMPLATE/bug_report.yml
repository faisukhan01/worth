name: Bug Report
description: Report something broken or behaving incorrectly in Lodestar.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the details
        below so it can be triaged quickly. Do not paste API keys or secrets.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps (commands, curl calls, UI clicks).
      placeholder: |
        1. Start stack with `docker compose up -d`
        2. POST /v1/ingest/metrics with ...
        3. Open http://localhost:3000 ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - web (Next.js dashboard)
        - ingest-gateway (Go)
        - aiops-engine (Python)
        - billing-core (Java)
        - reporting (.NET)
        - mobile (Flutter)
        - pulseagent (C edge agent)
        - platform (compose / k8s / terraform / CI)
        - docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag, commit SHA, or `docker compose ps` image tag.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions (bun/go/python/java/dotnet), docker or k8s.
      placeholder: Ubuntu 24.04, bun 1.3.x, docker compose v2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Sanitized logs or error output (no API keys).
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I removed all secrets and API keys from logs
          required: true
