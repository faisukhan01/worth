name: Feature Request
description: Propose an improvement or new capability for Lodestar.
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Please describe the problem first, then the
        proposed solution - keep it platform-scoped (no test files; CI is
        build/lint only by project rule).
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to achieve? What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Sketch APIs, UI, or config if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated, including workarounds.
  - type: dropdown
    id: component
    attributes:
      label: Target component
      options:
        - web (Next.js dashboard)
        - ingest-gateway (Go)
        - aiops-engine (Python)
        - billing-core (Java)
        - reporting (.NET)
        - mobile (Flutter)
        - pulseagent (C edge agent)
        - platform (compose / k8s / terraform / CI)
        - docs
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: This changes an existing API contract (docs/api-contracts.md)
        - label: This adds a new service or port
        - label: This requires infrastructure changes (k8s / terraform / compose)
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this idea
          required: true
