server:
  port: 4100
  shutdown: graceful

spring:
  application:
    name: billing-core
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:h2:file:./data/billing
    driver-class-name: org.h2.Driver
    username: lodestar
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

lodestar:
  billing:
    seed:
      enabled: true
    admin-api-key: change-me-admin-key
    purge-cron: "0 0 3 * * *"
  cors:
    allowed-origins: http://localhost:3000
